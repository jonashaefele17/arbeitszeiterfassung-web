name: Supabase keep-alive

# Gratis-Supabase-Projekte pausieren nach ca. 1 Woche Inaktivität (z. B. im Urlaub).
# Ein täglicher, datenfreier Aufruf hält das Projekt aktiv.
on:
  schedule:
    - cron: '17 5 * * *' # täglich 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: keep_alive() aufrufen
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          BASE="${SUPABASE_URL%/}"
          BASE="${BASE%/rest/v1}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status"
          test "$status" = "200"
